name: Price history

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
  push:
    branches: [claude/sharp-curie-y20pyw]
    paths: ['scripts/price-history/**', '.github/workflows/price-history.yml']

permissions:
  contents: write

concurrency:
  group: price-history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
      - name: Probe archive
        run: |
          UA='PullCheck/1.0 (price-history; github.com/b08007621-wq/pullcheck)'
          curl -sS -A "$UA" https://tcgcsv.com/archive/tcgplayer/prices-2024-02-08.ppmd.7z | head -c 800; echo
          curl -sS -A "$UA" https://tcgcsv.com/faq | sed 's/<[^>]*>/ /g' | grep -i -A3 -B3 'archive' | head -60
          curl -sS -A "$UA" https://tcgcsv.com/docs | sed 's/<[^>]*>/ /g' | grep -i -A3 -B3 'archive' | head -40
          curl -sS -A "$UA" https://tcgcsv.com/ | grep -io 'href="[^"]*archive[^"]*"' | head -20
