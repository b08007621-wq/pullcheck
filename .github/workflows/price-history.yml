name: Price history

on:
  workflow_dispatch:
  schedule:
    - cron: '43 21 * * *'

permissions:
  contents: write

concurrency:
  group: price-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load existing history
        run: |
          mkdir -p data
          if git ls-remote --exit-code origin refs/heads/price-history >/dev/null; then
            git fetch --depth 1 origin price-history
            git --work-tree=data checkout FETCH_HEAD -- .
            git reset -q
          fi
      - name: Collect today's prices
        run: node scripts/price-history/collect.mjs data
      - name: Publish
        run: |
          cd data
          git init -q -b price-history
          git config user.name "pullcheck-bot"
          git config user.email "pullcheck-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Price history $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" price-history
          du -sh .
